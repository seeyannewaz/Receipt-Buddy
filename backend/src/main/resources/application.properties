spring.application.name=backend

server.port=8080

# --- Postgres ---
spring.datasource.url=jdbc:postgresql://localhost:5433/receipt_buddy
spring.datasource.username=receipts
spring.datasource.password=receipts
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true

# Upload limits
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# Where uploaded images are stored locally
app.upload-dir=uploads

# --- OpenAI (key comes from env var OPENAI_API_KEY) ---
app.openai.apiKey=${OPENAI_API_KEY}
app.openai.model=gpt-5.2
app.openai.baseUrl=https://api.openai.com/v1
